# evproxy configuration. Unknown keys are a hard error, so a typo in a benchmark config fails
# loudly instead of silently running defaults.

listen_host = 127.0.0.1
listen_port = 8888
backlog     = 512

# thread_per_conn | thread_pool | event_loop
backend = thread_per_conn

max_header_bytes = 16384
max_body_bytes   = 8388608
io_chunk_bytes   = 32768

# macOS defaults RLIMIT_NOFILE to 256. A proxy that stalls at ~250 connections looks broken and is
# not, and any benchmark that hits this ceiling reports an artifact. The effective value is logged
# at startup -- check it before trusting a number.
desired_fd_limit = 10240

poll_timeout_ms = 30000

# 0 silent, 1 error, 2 info, 3 debug. Benchmarks run at 0.
log_level = 2
